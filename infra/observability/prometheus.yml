global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cakecraft-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['api:3001']
        labels:
          service: 'cakecraft-api'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
